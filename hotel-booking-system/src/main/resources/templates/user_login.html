<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập khách hàng - Đại Bàng Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f4f8fb;">
<nav class="navbar navbar-expand-lg navbar-dark" style="background:#003c71;">
    <div class="container">
        <a class="navbar-brand" href="/">Đại Bàng Hotel</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/user/register">Đăng ký</a></li>
                <li class="nav-item"><a class="nav-link" href="/user/history">Lịch sử</a></li>
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <h3 class="card-title mb-4 text-center">Đăng nhập khách hàng</h3>
                    <p class="text-muted text-center">Nhập số điện thoại và email để truy cập lịch sử đặt phòng.</p>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <form action="/user/login" method="post">
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" class="form-control" name="phone" placeholder="0912xxxxxx" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" placeholder="email@domain.com" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
                    </form>
                    <p class="text-center text-muted mt-4">Chưa có tài khoản? <a href="/user/register">Đăng ký ngay</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
